name: Publish to npm

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Clone Matterbridge
        run: git clone --depth 1 --single-branch --no-tags -b main https://github.com/Luligu/matterbridge.git ../matterbridge

      - name: Install Matterbridge dependencies
        working-directory: ../matterbridge
        run: npm ci --no-fund --no-audit

      - name: Build Matterbridge
        working-directory: ../matterbridge
        run: npm run build

      - name: Link Matterbridge globally
        working-directory: ../matterbridge
        run: npm link --no-fund --no-audit

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Link Matterbridge in project
        run: npm link matterbridge --no-fund --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run buildProduction

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: 'npm version patch -m "chore(release): v%s [skip ci]"'

      - name: Build release package
        id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "file=$(npm pack --ignore-scripts)" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Publish
        run: npm publish --provenance --access public --tag latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          VERSION: ${{ steps.package.outputs.version }}
        run: gh release create "v${VERSION}" "${PACKAGE_FILE}" --verify-tag --generate-notes --title "v${VERSION}"

  publish-dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Clone Matterbridge
        run: git clone --depth 1 --single-branch --no-tags -b main https://github.com/Luligu/matterbridge.git ../matterbridge

      - name: Install Matterbridge dependencies
        working-directory: ../matterbridge
        run: npm ci --no-fund --no-audit

      - name: Build Matterbridge
        working-directory: ../matterbridge
        run: npm run build

      - name: Link Matterbridge globally
        working-directory: ../matterbridge
        run: npm link --no-fund --no-audit

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Link Matterbridge in project
        run: npm link matterbridge --no-fund --no-audit

      - name: Set unique dev version
        env:
          DEV_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEV_RUN_NUMBER: ${{ github.run_number }}
        run: |
          base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          IFS=. read -r major minor patch <<< "$base_version"
          dev_version="${major}.${minor}.$((patch + 1))-dev.${DEV_RUN_NUMBER}.${DEV_RUN_ATTEMPT}"
          npm version "$dev_version" --no-git-tag-version

      - name: Publish dev
        run: npm publish --provenance --access public --tag dev
